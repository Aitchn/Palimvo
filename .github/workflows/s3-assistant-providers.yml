name: s3-assistant-providers
on:
  push:
    branches: [claude/project-thread-qkj1b7]
jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/s3-assistant-providers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
        timeout-minutes: 3
